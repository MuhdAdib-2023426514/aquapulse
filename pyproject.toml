[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swimming-pool-monitoring-system"
version = "0.1.0"
description = "AquaPulse: Privacy-First Agentic Vision Monitoring & ESG Optimization System for Residential Swimming Pools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "streamlit>=1.41.0",
    "plotly>=5.24.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "scikit-learn>=1.6.0",
    "ultralytics>=8.3.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aquapulse"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
override-dependencies = [
    "opencv-python-headless>=4.10.0",
    "opencv-python; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
